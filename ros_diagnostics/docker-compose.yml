# DESCONTINUADO: use `../ulg_analysis/docker-compose.yml` (stack unificado)
# em vez deste arquivo. Antes, subir so este compose project deixava
# drone_diagnostics sem nenhuma dependencia declarada do InfluxDB — um
# outage do InfluxDB (ou reboot do host) o deixava horas escrevendo em
# loop de falha sem que nada o religasse na ordem certa. O compose
# unificado adiciona `depends_on: influxdb: condition: service_healthy` e
# sobe tudo junto com um `docker compose up -d` so. Este arquivo fica
# apenas para referencia/rollback; nao usar em producao.
services:
  drone_diagnostics:
    build:
      context: .
      dockerfile: Dockerfile
    # host networking is required so the container sees ROS2/DDS traffic
    # on the same LAN segment as the drone's uXRCE bridge
    network_mode: host
    env_file: ../.env
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_URL: ${INFLUXDB_URL:-http://localhost:8086}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-aerobatics}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-drone_diagnostics}
    command: >
      ros2 launch drone_diagnostics drone_diagnostics.launch.py
        enable_influxdb:=true
        influxdb_url:=http://localhost:8086
        influxdb_org:=aerobatics
        influxdb_bucket:=drone_diagnostics
    restart: unless-stopped
